llm:
  provider: "openai"  # Primary provider, extendable to "anthropic", "google", etc.
  # For emotion embeddings (label-only processing)
  embedding_model: "text-embedding-3-small"  # OpenAI embedding model
  # For video description (vision processing)
  vision_model: "gpt-4o-mini"  # Vision model: "gpt-4o", "gpt-4o-mini", "gpt-4-turbo"
  # Use vision_model for video processing, embedding_model for text embeddings
  model: "gpt-4o-mini"  # Default model (used for vision if vision_model not set)
  api_key_env: "OPENAI_API_KEY"  # Environment variable name (loaded from .env)
  cache_dir: "data/llm_cache"  # Relative to experiment directory
  use_cache: true
  cache_version: "1.2"  # For cache invalidation if needed (bumped for binary classification revert)
  vision_detail: "low"  # Image detail: "low" (cheaper) or "high" (better quality)
  max_frames_per_video: 4  # Number of frames to send to LLM (1-8, default 4 for balance)

fusion:
  # Primary method: Weighted Average (most common in literature)
  method: "weighted_average"  # Options: "weighted_average", "attention"
  clip_weight: 0.7  # Weight for CLIP scores (0.0 to 1.0)
  llm_weight: 0.3   # Weight for LLM scores (1.0 - clip_weight)
  
  # Attention-based fusion (if method = "attention")
  attention_dim: 128  # Dimension for attention mechanism
  
  # Future: Concatenation + MLP (requires training)
  # mlp_hidden_dim: 256

data:
  dataset_type: "cam"  # "cam" or "eu_emotion"
  
  cam_data_root: "/Users/eb2007/Library/CloudStorage/OneDrive-UniversityofCambridge/Documents/PhD/data/mindreading_transporter_files/Mindreading emotions library/Emotions"
  eu_emotion_data_root: "/Users/eb2007/Library/CloudStorage/OneDrive-UniversityofCambridge/Documents/PhD/data/EU_emotions"
  

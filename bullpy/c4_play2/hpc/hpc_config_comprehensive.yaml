# Comprehensive HPC Configuration for Autism Classification
# Expanded hyperparameter grids for maximum optimization

# Data Configuration
data:
  input_file: "data/processed/data_c4_balanced_fe.csv"
  target_column: "autism_target"
  test_size: 0.2
  random_state: 42
  stratify: true

# Feature Engineering (OPTIMIZED for queue positioning)
feature_engineering:
  imputation_strategy: "mean"
  feature_selection:
    selectkbest_k: [75, 100, 150]
    rfe_n_features: [75, 100, 150]

# Random Forest Parameters (OPTIMIZED for queue positioning)
random_forest:
  # Reduced grid so it can finish within typical 6-12h QOS limits
  n_estimators: [100, 300, 500]
  max_depth: [10, 20, None]
  min_samples_split: [2, 5]
  min_samples_leaf: [1, 2]
  max_features: ["sqrt", "log2"]
  criterion: ["gini"]
  class_weight: ["balanced", None]

# XGBoost Parameters (MINIMAL - ~48 combinations for speed)
xgboost:
  # Drastically reduced to ~48 combinations (8x faster than previous!)
  n_estimators: [200, 500]
  max_depth: [3, 5]
  learning_rate: [0.05, 0.1]
  subsample: [0.8]
  colsample_bytree: [0.8]
  reg_alpha: [0]
  reg_lambda: [1.0]
  scale_pos_weight: [1.0, 2.0]

# LightGBM Parameters (OPTIMIZED for queue positioning)
lightgbm:
  n_estimators: [200, 500]
  max_depth: [3, 7, -1]
  learning_rate: [0.05, 0.1]
  num_leaves: [31, 63]
  subsample: [0.8, 1.0]
  colsample_bytree: [0.8, 1.0]
  reg_alpha: [0, 0.1]
  reg_lambda: [0.0, 1.0]
  class_weight: ["balanced", None]

# CatBoost Parameters (OPTIMIZED for queue positioning)
catboost:
  iterations: [100, 200, 500]
  depth: [3, 5, 7]
  learning_rate: [0.01, 0.1, 0.2]
  l2_leaf_reg: [1, 3, 5]
  border_count: [32, 64, 128]
  class_weights: [None, "balanced"]

# Gradient Boosting Parameters (REDUCED)
gradient_boosting:
  n_estimators: [200, 500]
  max_depth: [3, 5, 7]
  learning_rate: [0.05, 0.1]
  subsample: [0.8, 0.9]
  max_features: ["sqrt", "log2"]

# Logistic Regression Parameters (EXPANDED)
logistic_regression:
  C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  penalty: ["l1", "l2", "elasticnet"]
  solver: ["liblinear", "saga", "lbfgs"]
  max_iter: [1000, 2000, 5000]
  class_weight: ["balanced", None]

# Extra Trees Parameters (OPTIMIZED for queue positioning)
extra_trees:
  n_estimators: [100, 200, 500]
  max_depth: [10, 15, 20, None]
  min_samples_split: [2, 5, 10]
  min_samples_leaf: [1, 2, 4]
  max_features: ["sqrt", "log2", None]
  criterion: ["gini", "entropy"]
  class_weight: ["balanced", None]

# Cross-Validation (REDUCED from 5 to 3 folds for faster execution)
cross_validation:
  inner_cv: 3
  outer_cv: 3

# Output Configuration
output:
  results_dir: "results"
  models_dir: "models"
  logs_dir: "logs"
  plots_dir: "plots"
  save_models: true

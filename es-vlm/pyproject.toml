[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esvlm"
version = "0.1.0"
description = "Empathizing and systemizing directions inside open-weight vision-language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edward Bullock" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pillow>=10.4",
  "huggingface_hub>=0.34,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "nbstripout>=0.7",
  "pandas-stubs>=2.2",
  "types-pillow>=10.2",
  "torch>=2.4",
]

[project.scripts]
esvlm-smoke = "esvlm.cli.smoke:main"
esvlm-score = "esvlm.cli.score:main"
esvlm-extract = "esvlm.cli.extract:main"
esvlm-analyze-extract = "esvlm.cli.analyze_extract:main"
esvlm-report-rq1 = "esvlm.cli.report_rq1:main"
esvlm-extract-personas = "esvlm.cli.extract_personas:main"
esvlm-extract-task = "esvlm.cli.extract_task:main"
esvlm-steer = "esvlm.cli.steer:main"
esvlm-fetch-sdomain = "esvlm.cli.fetch_sdomain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esvlm = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
pretty = true
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scog"
version = "0.1.0"
description = "Shared data, scoring and inference code for the social cognition studies."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "statsmodels==0.14.5",
    "pingouin==0.5.5",
    "factor_analyzer==0.5.1",
    "openpyxl==3.1.5",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
infer = [
    "transformers==4.51.3",
    "peft==0.15.2",
    "accelerate==1.6.0",
    "imageio-ffmpeg==0.6.0",
    "av==14.4.0",
]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
